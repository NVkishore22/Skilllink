{% extends "base.html" %}

{% block title %}Profile - SkillLink{% endblock %}

{% block content %}
<div class="container">
    <h2>My Profile</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="{{ profile.name if profile else '' }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ profile.email if profile else '' }}" required>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" value="{{ profile.mobile if profile else '' }}" required>
        </div>
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" value="{{ profile.location if profile else '' }}" required>
        </div>
        {% if current_user.role == 'worker' %}
        <div class="form-group">
            <label for="skills">Skills</label>
            <textarea id="skills" name="skills" rows="4" required>{{ profile.skills if profile else '' }}</textarea>
        </div>
        {% elif current_user.role == 'employer' %}
        <div class="form-group">
            <label for="workplace_name">Name of the WorkPlace</label>
            <input type="text" id="workplace_name" name="workplace_name" value="{{ profile.workplace_name if profile else '' }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required>{{ profile.description if profile else '' }}</textarea>
        </div>
        {% endif %}
        <button type="submit" class="btn">Update Profile</button>
    </form>
</div>
{% endblock %}
